<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="body">

    <section class="section">

        <div class="section-div1">
            <p class="section-div1-p"><span class="section-div1-p-aparecenNumeros"></span><span class="section-div1-p-barra">|</span></p>
        </div>

        <div class="section-div2">

            <div class="section-div2-div1">
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">1</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">2</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">3</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">4</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">5</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">6</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">7</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">8</p>
                </div>
                <div class="section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">9</p>
                </div>
                <div class="section-div2-div1-number--0 section-div2-div1-number">
                    <p class="section-div2-div1-number--numeroPulsado">0</p>
                </div>
            </div>


            <div class="section-div2-div2">
                <div class="section-div2-div2-signo section-div2-div2-signo--mas">
                    <p class="section-div2-div2-signo--signoPulsado">+</p>
                </div>
                <div class="section-div2-div2-signo section-div2-div2-signo--menos">
                    <p class="section-div2-div2-signo--signoPulsado">-</p>
                </div>
                <div class="section-div2-div2-signo section-div2-div2-signo--multiplicar">
                    <p class="section-div2-div2-signo--signoPulsado">*</p>
                </div>
                <div class="section-div2-div2-signo section-div2-div2-signo--dividir">
                    <p class="section-div2-div2-signo--signoPulsado">/</p>
                </div>
                <div class="section-div2-div2-igualYBorrar">
                    <div class="section-div2-div2-igualYBorrar-signo section-div2-div2-signo section-div2-div2-igualYBorrar-signo--igual">
                        <p class="section-div2-div2-signo--signoPulsado">=</p>
                    </div>
                    <div class="section-div2-div2-igualYBorrar-signo section-div2-div2-signo section-div2-div2-igualYBorrar-signo--borrarTodo">
                        <p class="section-div2-div2-signo--signoPulsado section-div2-div2-igualYBorrar-signo--signoPulsado">CE</p>
                    </div>
                </div>


            </div>

        </div>

    </section>
    

    <script src="./scripts.js"></script>
</body>
</html>
